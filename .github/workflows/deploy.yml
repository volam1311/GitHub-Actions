name: deploy
on:
    push:
        branches: [main]
permissions: {}
jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/upload-pages-artifact@v3
              with:
               path: site/
    deploy:
        needs: build
        environment: 
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-24.04
        permissions:
            pages: write
            id-token: write
        steps:
        - id: deployment
          uses: actions/deploy-pages@v4