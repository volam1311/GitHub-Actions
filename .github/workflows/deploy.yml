name: deploy
on:
    push:
        branches: [main]
permissions: {}
jobs:
    deploy:
        environment: 
            name: github-pages
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
        - uses: actions/checkout@v4
        - uses: actions/upload-pages-artifact@v3
          with:
            path: site/
        - id: deployment
          uses: actions/deploy-pages@v4