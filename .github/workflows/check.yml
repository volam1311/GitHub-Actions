name: check
on: 
    pull_request: 
permissions: {}
jobs:
    test:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: python3 scripts/check_site.py